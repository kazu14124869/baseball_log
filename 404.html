<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンテナンス中 | ページが見つかりません</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, '平角ゴシック Simpl', sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      text-align: center;
      background: #ffffff;
      padding: 40px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
    }
    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #2c3e50;
      line-height: 1.4;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 20px;
    }
    .notice-box {
      background-color: #eef2f7;
      border-left: 4px solid #007bff;
      padding: 12px 15px;
      text-align: center;
      font-size: 13px;
      color: #444;
      border-radius: 4px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🛠️</div>
    <h1>ただいまメンテナンス中<br>（調整中）です</h1>
    <p>
      お探しのページは現在更新中か、一時的にご利用いただけない状態になっています。<br>
      作業完了まで今しばらくお待ちください。
    </p>

    <!-- スマホのホーム画面へ戻る短い案内 -->
    <div class="notice-box">
      恐れ入りますが、ホームボタン等でスマホのホーム画面へお戻りください。
    </div>
  </div>

</body>
</html>
